services:
  redis:
    image: redis:7-alpine
    container_name: logmind-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: logmind-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: logmind-postgres
    environment:
      - POSTGRES_USER=logmind
      - POSTGRES_PASSWORD=logmind
      - POSTGRES_DB=logmind
    ports:
      - "5432:5432"
    restart: unless-stopped

  api:
    build: .
    container_name: logmind-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - DATABASE_URL=postgresql+asyncpg://logmind:logmind@postgres:5432/logmind
    depends_on:
      - redis
      - elasticsearch
      - postgres
    restart: unless-stopped

  worker:
    build: .
    container_name: logmind-worker
    command: ["uv", "run", "python", "-m", "app.workers.indexer"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - DATABASE_URL=postgresql+asyncpg://logmind:logmind@postgres:5432/logmind
    depends_on:
      - redis
      - elasticsearch
      - postgres
    restart: unless-stopped
