[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "logmind"
version = "0.1.0"
description = "Engineering incident investigation platform for distributed applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis>=5.0.8",
    "elasticsearch[async]>=8.15.0",
    "fastembed>=0.3.4",
    "httpx>=0.27.0",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
